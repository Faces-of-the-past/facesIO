[project]
name = "facesIO"
version = "0.1.0"
description = ""
authors = [
    {name = "Pablo Rodríguez Sánchez",email = "pablo.rodriguez.sanchez@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "rdflib (>=7.6.0,<8.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "ipython (>=9.18.1,<10.0.0)"
]

[tool.poetry]
packages = [{include = "facesIO", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
